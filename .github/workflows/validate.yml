name: validate
on: [push, pull_request]
jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python3 tests/validate_plugin.py

  render-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install render pipeline dependencies
        working-directory: skills/codebase-schematic/references
        run: |
          uv sync
          uv run playwright install --with-deps chromium
      - name: Render the example diagram
        working-directory: skills/codebase-schematic/references
        run: |
          uv run python render_excalidraw.py ../../../examples/self/codebase-schematic.excalidraw --output /tmp/rendered.png --svg-output /tmp/rendered.svg
      - name: Verify the exported SVG matches the committed SVG exactly
        run: cmp /tmp/rendered.svg examples/self/codebase-schematic.svg
      - name: Sanity-check the PNG against the committed PNG
        run: |
          uv run --with pillow python tests/compare_render.py /tmp/rendered.png examples/self/codebase-schematic.png
      - name: Upload the render for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-example
          path: |
            /tmp/rendered.png
            /tmp/rendered.svg
          if-no-files-found: ignore
